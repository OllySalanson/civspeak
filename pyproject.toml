[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civspeak"
version = "0.1.0"
description = "Ask the Civ VI Civilopedia out loud"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# George's voice (Kokoro) and the microphone (Whisper). Without them the page still answers typed questions.
voice = ["kokoro-onnx>=0.6", "faster-whisper>=1.2", "numpy>=1.26"]
# The Windows app (`civspeak app`): its page window (WebView2, built into Windows 10 and 11), and its own
# microphone and speakers (sounddevice, with PortAudio inside).
app = ["pywebview>=6.2; sys_platform == 'win32'", "sounddevice>=0.5; sys_platform == 'win32'"]

[project.scripts]
civspeak = "civspeak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
civspeak = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["civspeak", "conftest"]

[tool.ruff.lint.per-file-ignores]
# The answer prompt is prose; its lines are paragraphs sent to the model as written.
"src/civspeak/answer.py" = ["E501"]
# Invented fixture XML, kept one row per line for readability.
"tests/conftest.py" = ["E501"]
